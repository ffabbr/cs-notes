<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EBNF Animation</title>
<style>
  @font-face {
    font-family: "Rohlik Inter";
    src: url("/static/fonts/inter-latin.woff2") format("woff2");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Rohlik JetBrains Mono";
    src: url("/static/fonts/jetbrains-mono-latin.woff2") format("woff2");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --fg: oklch(93% 0 0);
    --fg-muted: oklch(70% 0 0);
    --fg-faint: oklch(56% 0 0);
    --fg-ghost: oklch(40% 0 0);
    --bg: oklch(16.5% 0 0);
    --bg-sunken: oklch(13.8% 0 0);
    --bg-raised: oklch(20.5% 0 0);
    --rule: oklch(26.5% 0 0);
    --rule-strong: oklch(34% 0 0);
    --face-sans: "Rohlik Inter", Inter, system-ui, sans-serif;
    --face-mono: "Rohlik JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --radius: 10px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--face-sans);
    color-scheme: dark;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px;
  }

  .fig {
    width: min(100%, 720px);
    display: grid;
    gap: 18px;
  }

  .kicker, .chip, .result-label {
    font-family: var(--face-mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }

  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .goal {
    font-family: var(--face-mono);
    font-size: 0.92rem;
    color: var(--fg);
  }

  .rule {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.45rem 0.55rem;
    padding: 18px 16px;
    background: var(--bg-sunken);
    border: 1px dashed color-mix(in oklch, var(--fg) 18%, transparent);
    border-radius: var(--radius);
    font-family: var(--face-mono);
    font-size: clamp(0.92rem, 2.4vw, 1.12rem);
    line-height: 1.7;
  }

  .tok {
    padding: 0.12em 0.28em;
    border-radius: 6px;
    color: var(--fg-muted);
    transition: color 0.45s var(--ease), background-color 0.45s var(--ease);
  }

  .tok.is-nt { color: var(--fg); }
  .tok.is-op { color: var(--fg-faint); }
  .tok.is-term { color: var(--fg-muted); }

  .chunk {
    padding: 0.12em 0.34em;
    border-radius: 6px;
    color: var(--fg-muted);
    background: color-mix(in oklch, var(--fg) 6%, transparent);
    transition:
      color 0.45s var(--ease),
      background-color 0.45s var(--ease),
      box-shadow 0.45s var(--ease);
  }

  .chunk.is-on {
    color: var(--fg);
    background: color-mix(in oklch, var(--fg) 16%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--fg) 22%, transparent);
  }

  .note {
    min-height: 1.45em;
    text-align: center;
    color: var(--fg-muted);
    font-size: 0.95rem;
    line-height: 1.45;
  }

  .tape-wrap { display: grid; gap: 8px; }
  .tape {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    min-height: 56px;
  }

  .cell {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    border: 1px solid var(--rule-strong);
    background: color-mix(in oklch, var(--fg) 9%, transparent);
    font-family: var(--face-mono);
    font-size: 1.15rem;
    color: var(--fg);
    opacity: 0;
    transform: translateY(6px) scale(0.92);
  }

  .cell.is-in {
    opacity: 1;
    transform: none;
    transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
  }

  .ops {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .chip {
    padding: 0.28em 0.7em;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: color-mix(in oklch, var(--fg) 5%, transparent);
    transition: color 0.4s var(--ease), border-color 0.4s var(--ease), background-color 0.4s var(--ease);
  }

  .chip.is-on {
    color: var(--fg);
    border-color: color-mix(in oklch, var(--fg) 28%, transparent);
    background: color-mix(in oklch, var(--fg) 14%, transparent);
  }

  @media (prefers-reduced-motion: reduce) {
    .tok, .chunk, .cell, .chip { transition: none; }
    .cell { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<figure class="fig" role="img" aria-label="Eine EBNF-Produktion expandiert Operator für Operator zu einem konkreten String: zuerst +42, dann 7.">
  <div class="top">
    <div class="kicker">Ableitung</div>
    <div class="goal" id="goal">+42</div>
  </div>

  <div class="rule" aria-hidden="true">
    <span class="tok is-nt">&lt;int&gt;</span>
    <span class="tok is-op">&lt;=</span>
    <span class="chunk" data-part="sign">[+ | -]</span>
    <span class="chunk" data-part="d1">&lt;digit&gt;</span>
    <span class="chunk" data-part="rep">{&lt;digit&gt;}</span>
  </div>

  <p class="note" id="note">Eine Produktion ist ein Rezept. Die Operatoren bauen daraus einen String.</p>

  <div class="tape-wrap">
    <div class="result-label">abgeleitet</div>
    <div class="tape" id="tape" aria-hidden="true"></div>
  </div>

  <div class="ops" aria-hidden="true">
    <span class="chip" data-op="opt">[ ] optional</span>
    <span class="chip" data-op="choice">| Alternative</span>
    <span class="chip" data-op="nt">&lt; &gt; Nonterminal</span>
    <span class="chip" data-op="rep">{ } Wiederholung</span>
  </div>
</figure>

<script>
  const scenarios = [
    {
      goal: "+42",
      steps: [
        { part: null, ops: [], text: "Eine Produktion ist ein Rezept. Die Operatoren bauen daraus einen String.", tokens: [] },
        { part: "sign", ops: ["opt", "choice"], text: "Optional: das Vorzeichen nehmen, Alternative +.", tokens: ["+"] },
        { part: "d1", ops: ["nt"], text: "Erste Ziffer ist Pflicht. Nonterminal <digit> wird zu 4.", tokens: ["+", "4"] },
        { part: "rep", ops: ["rep", "nt"], text: "Wiederholung: noch eine Ziffer, 2.", tokens: ["+", "4", "2"] },
        { part: null, ops: [], text: "Fertig: [+ | -] <digit> {<digit>} hat +42 abgeleitet.", tokens: ["+", "4", "2"] },
      ],
    },
    {
      goal: "7",
      steps: [
        { part: null, ops: [], text: "Dieselbe Produktion, andere Entscheidungen.", tokens: [] },
        { part: "sign", ops: ["opt"], text: "Optional: weglassen. Kein Vorzeichen.", tokens: [] },
        { part: "d1", ops: ["nt"], text: "Erste Ziffer bleibt Pflicht. Diesmal 7.", tokens: ["7"] },
        { part: "rep", ops: ["rep"], text: "Wiederholung: null Mal. Die geschweifte Klammer darf leer bleiben.", tokens: ["7"] },
        { part: null, ops: [], text: "Fertig: dieselbe Produktion hat 7 abgeleitet.", tokens: ["7"] },
      ],
    },
  ]

  const note = document.getElementById("note")
  const tape = document.getElementById("tape")
  const goal = document.getElementById("goal")
  const chunks = [...document.querySelectorAll(".chunk")]
  const chips = [...document.querySelectorAll(".chip")]
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches

  let scene = 0
  let step = 0
  let timer

  function render(s) {
    goal.textContent = scenarios[scene].goal
    note.textContent = s.text
    chunks.forEach((el) => el.classList.toggle("is-on", el.dataset.part === s.part))
    chips.forEach((el) => el.classList.toggle("is-on", s.ops.includes(el.dataset.op)))
    tape.replaceChildren()
    s.tokens.forEach((ch) => {
      const cell = document.createElement("span")
      cell.className = "cell is-in"
      cell.textContent = ch
      tape.appendChild(cell)
    })
  }

  function tick() {
    const steps = scenarios[scene].steps
    render(steps[step])
    step += 1
    if (step >= steps.length) {
      step = 0
      scene = (scene + 1) % scenarios.length
      timer = setTimeout(tick, 2200)
    } else {
      timer = setTimeout(tick, 1400)
    }
  }

  if (reduce) {
    scene = 0
    render(scenarios[0].steps.at(-1))
  } else {
    tick()
    document.querySelector(".fig").addEventListener("click", () => {
      if (timer) {
        clearTimeout(timer)
        timer = null
      } else {
        tick()
      }
    })
  }
</script>
</body>
</html>
